name: Stage 2 – Create Pre-release
on:
  push:
    branches: ['rc/external']

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Token aus GitHub App generieren
        id: app-token
        shell: pwsh
        env:
          TOKEN_SECRET: ${{ secrets.GHTOKENWORKFLOW }}
        run: |
          $secret = $env:TOKEN_SECRET
          if ($secret.TrimStart().StartsWith('{')) {
            $json    = $secret | ConvertFrom-Json
            $toB64Url = { [Convert]::ToBase64String($args[0]).TrimEnd('=').Replace('+','-').Replace('/','_') }
            $now     = [System.DateTimeOffset]::UtcNow
            $header  = & $toB64Url ([System.Text.Encoding]::UTF8.GetBytes('{"alg":"RS256","typ":"JWT"}'))
            $payload = & $toB64Url ([System.Text.Encoding]::UTF8.GetBytes("{`"iat`":$($now.AddSeconds(-60).ToUnixTimeSeconds()),`"exp`":$($now.AddMinutes(10).ToUnixTimeSeconds()),`"iss`":`"$($json.GitHubAppClientId)`"}"))
            $rsa     = [System.Security.Cryptography.RSA]::Create()
            $rsa.ImportFromPem($json.PrivateKey)
            $sig     = & $toB64Url ($rsa.SignData([System.Text.Encoding]::UTF8.GetBytes("$header.$payload"), [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1))
            $jwt     = "$header.$payload.$sig"
            $apiHdr  = @{ Authorization = "Bearer $jwt"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            $install = Invoke-RestMethod -Method GET -Headers $apiHdr -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/installation"
            $body    = '{"permissions":{"contents":"write","pull_requests":"write","workflows":"write","metadata":"read","actions":"write"}}'
            $token   = (Invoke-RestMethod -Method POST -Headers $apiHdr -Body $body -ContentType "application/json" -Uri $install.access_tokens_url).token
          } else {
            $token = $secret
          }
          Write-Host "::add-mask::$token"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "token=$token"

      - run: |
          gh workflow run "CreateRelease.yaml" \
            --ref rc/external \
            --field prerelease=true \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
