name: Stage 1 – Merge into rc/internal
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  merge-to-internal:
    if: contains(vars.RELEASE_STAGES, 'internal')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Token aus GitHub App generieren
        id: app-token
        shell: pwsh
        env:
          TOKEN_SECRET: ${{ secrets.GHTOKENWORKFLOW }}
        run: |
          $secret = $env:TOKEN_SECRET
          if ($secret.TrimStart().StartsWith('{')) {
            $json    = $secret | ConvertFrom-Json
            $toB64Url = { [Convert]::ToBase64String($args[0]).TrimEnd('=').Replace('+','-').Replace('/','_') }
            $now     = [System.DateTimeOffset]::UtcNow
            $header  = & $toB64Url ([System.Text.Encoding]::UTF8.GetBytes('{"alg":"RS256","typ":"JWT"}'))
            $payload = & $toB64Url ([System.Text.Encoding]::UTF8.GetBytes("{`"iat`":$($now.AddSeconds(-60).ToUnixTimeSeconds()),`"exp`":$($now.AddMinutes(10).ToUnixTimeSeconds()),`"iss`":`"$($json.GitHubAppClientId)`"}"))
            $rsa     = [System.Security.Cryptography.RSA]::Create()
            $rsa.ImportFromPem($json.PrivateKey)
            $sig     = & $toB64Url ($rsa.SignData([System.Text.Encoding]::UTF8.GetBytes("$header.$payload"), [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1))
            $jwt     = "$header.$payload.$sig"
            $apiHdr  = @{ Authorization = "Bearer $jwt"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            $install = Invoke-RestMethod -Method GET -Headers $apiHdr -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/installation"
            $body    = '{"permissions":{"contents":"write","pull_requests":"write","workflows":"write","metadata":"read","actions":"read"}}'
            $token   = (Invoke-RestMethod -Method POST -Headers $apiHdr -Body $body -ContentType "application/json" -Uri $install.access_tokens_url).token
          } else {
            $token = $secret
          }
          Write-Host "::add-mask::$token"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "token=$token"

      - name: Labels zurücksetzen (bei erneutem Push nach fehlgeschlagenem Test)
        if: github.event.action == 'synchronize'
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "internal-tested" \
            --repo ${{ github.repository }} 2>/dev/null || true
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "external-tested" \
            --repo ${{ github.repository }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge feature branch into rc/internal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --prune
          git fetch origin ${{ github.head_ref }}
          if git ls-remote --exit-code origin rc/internal > /dev/null 2>&1; then
            git checkout rc/internal
            git reset --hard origin/rc/internal
          else
            echo "Branch rc/internal existiert nicht – wird aus main angelegt"
            git checkout -b rc/internal origin/main
            git push origin rc/internal
          fi
          git merge "origin/${{ github.head_ref }}" --no-edit \
            -m "Merge ${{ github.head_ref }} into rc/internal" || {
            echo "::error::Merge-Konflikt: ${{ github.head_ref }} kann nicht in rc/internal gemerged werden"
            git merge --abort
            exit 1
          }
          git push origin rc/internal
